[build]
  publish = "dist/"
  command = "make deploy"
  functions = "src/lambda"

[[redirects]]
	from = "/reddit"
  	to = "https://reddit.com/u/marcysvoneylau"

[[redirects]]
  	from = "/twitter"
  	to = "https://twitter.com/yasiupl"

[[redirects]]
  	from = "/linkedin"
  	to = "https://www.linkedin.com/in/yasiu"

[[redirects]]
  	from = "/github"
    	to = "https://github.com/yasiupl"
    
[[redirects]]
  	from = "/patreon"
  	to = "https://www.patreon.com/yasiupl"

[[redirects]]
  	from = "/donate"
  	to = "https://www.patreon.com/yasiupl"

[[redirects]]
  	from = "/paypal"
  	to = "https://www.paypal.me/yasiupl"

[[redirects]]
  	from = "/youtube"
  	to = "https://www.youtube.com/channel/UCqFJAKOMWvS_oKHk9ppMC8w" 

[[redirects]]
  	from = "/ssh.pub"
  	to = "https://github.com/yasiupl.keys" 
	
[[redirects]]
  	from = "/pgp.pub"
  	to = "https://keybase.io/yasiupl/pgp_keys.asc?fingerprint=fe683591ae239dc2188c4bba1e3e8090e179f056"

# Bridgy Fed: the fediverse handle @yasiu@yasiu.pl (see README.md, "Fediverse").
[[redirects]]
  from = "/.well-known/host-meta*"
  to = "https://fed.brid.gy/.well-known/host-meta:splat"
  status = 302

[[redirects]]
  from = "/.well-known/webfinger*"
  to = "https://fed.brid.gy/.well-known/webfinger"
  status = 302

# The private CV and business card (with the phone number) are not linked from the site. Search engines must not index it.
[[headers]]
  for = "/cv/Resume_*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cv/Card_*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Short address of the CV.
[[redirects]]
  from = "/cv"
  to = "/cv/Marcin_Jasiukowicz_CV.pdf"
  status = 302

# The thesis PDFs moved from /resume/ to their blog posts.
[[redirects]]
  from = "/resume/bachelor_thesis.pdf"
  to = "/blog/engineering-thesis-stardust/bachelor_thesis.pdf"
  status = 301

[[redirects]]
  from = "/resume/*"
  to = "/blog/masters-thesis-ops-sat/:splat"
  status = 301
