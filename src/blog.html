<!DOCTYPE html>
<html lang="<%= page.lang %>">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff4f00" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="<%= page.description %>" />
  <meta property="og:title" content="<%= page.title %>" />
  <meta property="og:url" content="<%= page.url %>" />
  <meta property="og:image" content="<%= page.image %>" />
  <meta property="og:description" content="<%= page.description %>" />
  <meta property="og:type" content="<%= page.type %>" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="<%= page.title %>" />
  <meta name="twitter:description" content="<%= page.description %>" />
  <meta name="twitter:image" content="<%= page.image %>" />
  <!-- Mastodon shows this account as the author on link previews of the page. -->
  <meta name="fediverse:creator" content="@yasiu@0x3c.pl" />
  <link rel="canonical" href="<%= page.url %>" />
  <link rel="alternate" type="application/atom+xml" title="yasiu.pl blog" href="/blog/feed.xml" />
  <% if (page.type === 'article') { %>
  <!-- Bridgy Fed: lets fediverse servers find this post when you search for its URL. -->
  <link rel="alternate" type="application/activity+json" href="https://fed.brid.gy/r/<%= page.url %>" />
  <% } %>
  <link rel="webmention" href="https://webmention.io/yasiu.pl/webmention" />
  <link rel="pingback" href="https://webmention.io/yasiu.pl/xmlrpc" />
  <title><%= page.title %> · yasiu.pl</title>
  <!-- Plausible Analytics (self-hosted). Also counts file downloads (for example the CV) and outbound links. -->
  <script defer data-domain="yasiu.pl" src="https://plausible.yasiu.pl/js/script.file-downloads.outbound-links.js"></script>
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-71778687-1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'UA-71778687-1');
  </script>
  <script>
    // Apply a saved theme before first paint (no flash). No saved theme = follow the OS.
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('theme', t); } catch (e) {}
  </script>
</head>

<body id="top" class="blog">
  <nav class="navbar" aria-label="Main">
    <div class="nav-wrapper">
      <div class="container">
      <a href="/" id="logo-container" class="brand-logo">yasiu.pl</a>
      <ul class="hide-on-med-and-down">
        <li><a href="/#work">Projects</a></li>
        <li><a href="/blog/" aria-current="page">Blog</a></li>
        <li><a href="/#timeline">Timeline</a></li>
        <li><a href="/cv/Marcin_Jasiukowicz_CV.pdf">CV</a></li>
        <li><a href="https://www.patreon.com/yasiupl" target="_blank" rel="noopener">Patreon</a></li>
        <li><a href="https://www.amazon.com/hz/wishlist/ls/JNQ7C2Q934HA" target="_blank" rel="noopener">Wishlist</a></li>
        <li><a href="mailto:contact@yasiu.pl?subject=Website%20Contact%20Form">Contact</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme: follow system"></button>
      </div>
    </div>
  </nav>

  <main>
    <div class="section">
      <div class="container blog-container">
        <%= page.main %>
      </div>
    </div>
  </main>
</body>
</html>
